# MkDocs configuration for Claude Code Plugins
# Navigation is curated. Active plugin documentation lives in the standalone repositories.

nav:
- Home: index.md
- RForge:
  - Quick Start: rforge/quick-start.md
  - Commands: rforge/commands.md
  - Architecture: rforge/architecture.md
  - Workflows & Examples: rforge/workflows.md
- Craft:
  - Quick Start: craft/quick-start.md
  - Commands: craft/commands.md
  - Skills & Agents: craft/skills-agents.md
  - Architecture: craft/architecture.md
  - Orchestrator: craft/orchestrator.md
  - Workflows & Examples: craft/workflows.md
- Workflow:
  - Quick Start: workflow/quick-start.md
  - Commands: workflow/commands.md
  - Skills & Agents: workflow/skills-agents.md
  - Workflows & Examples: workflow/workflows.md
- Statistical Research:
  - Quick Start: statistical-research/quick-start.md
  - Commands: statistical-research/commands.md
  - Skills: statistical-research/skills.md
  - API Wrappers: statistical-research/api-wrappers.md
  - Workflows & Examples: statistical-research/workflows.md
- Getting Started:
  - Installation: installation.md
  - Quick Start: quick-start.md
- Developer Guide: CLAUDE.md
- Mode System:
  - Usage Guide: MODE-USAGE-GUIDE.md
  - Quick Reference: MODE-QUICK-REFERENCE.md
  - Command Cheatsheet: COMMAND-CHEATSHEET.md
  - Format Examples: FORMAT-EXAMPLES.md
  - MCP Integration Testing: MCP-INTEGRATION-TESTING.md
  - Real-World Testing: REAL-WORLD-TESTING-RESULTS.md
  - Architecture: MODE-SYSTEM.md
- CI/CD Guide: CICD.md
- Marketplace:
  - Active Plugins: PLUGIN-CATALOG.md
  - Command Documentation Sources: COMMAND-REFERENCE.md
- Plugin Development: PLUGIN-DEVELOPMENT.md
- Publishing: PUBLISHING.md
- Architecture:
  - Dependencies: diagrams/DEPENDENCIES.md
  - Ecosystem: diagrams/ECOSYSTEM.md
  - RForge Flow: diagrams/rforge-flow.md
  - RForge Structure: diagrams/rforge-structure.md
  - Statistical Research Flow: diagrams/statistical-research-flow.md
  - Statistical Research Structure: diagrams/statistical-research-structure.md
  - Workflow Flow: diagrams/workflow-flow.md
  - Workflow Structure: diagrams/workflow-structure.md
# Keep orphaned internal snapshots in the repository, but do not publish pages with broken local links.
exclude_docs: |
  /craft/docs/DOCUMENTATION-MAKING-GUIDE.md
  /plugins/craft.md
  /plugins/rforge.md
  /plugins/statistical-research.md
  /plugins/workflow.md
  /rforge/docs/README.md
  /rforge/docs/quickstart.md
  /specs/SPEC-documentation-architecture-2026-01-09.md
  /statistical-research/docs/README.md
  /workflow/docs/README.md
  /workflow/docs/QUICK-START.md
  /workflow/docs/REFCARD.md
site_name: Claude Code Plugins
repo_url: https://github.com/Data-Wise/claude-plugins
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.indexes
  - navigation.sections
  - navigation.expand
  - search.suggest
  - search.highlight
  - content.code.copy
markdown_extensions:
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.details
- admonition
- tables
- attr_list
- def_list
